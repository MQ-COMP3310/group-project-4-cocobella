{% extends 'base.html' %} {% block content %}
<div class="container base-content">
    <div class="row">
        <div class="col text-center">
            <br>
            <h3 class="text-center">HIGHSCORE BOARD</h3>

            <table class="table table-striped table-bordered table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Score</th>
                    </tr>
                </thead>

                <tbody>
                    {% if usernames_and_scores %}
                        {% for username, score in usernames_and_scores %}
                        <tr>
                            <th scope="row">{{ loop.index }}</th>
                            <td>{{ username }}</td>
                            <td>{{ score }}</td>
                        </tr>
                        {% endfor %}
                    {% else %}
                        <tr>
                            <td colspan="3">No highscores available.</td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
