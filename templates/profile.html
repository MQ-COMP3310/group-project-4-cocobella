{% extends 'base.html' %} {% block content %}
<div class="container base-content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center">User Profile</h1>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Welcome, {{ current_user.username }}</h5>
                    <p class="card-text">Your account details are shown below.</p>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><strong>Username:</strong> {{ current_user.username }}</li>
                        <li class="list-group-item"><strong>High Score:</strong> {{ current_user.high_score }}</li>
                    </ul>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-secondary hvr-round-corners">Back to Home</a>
                <a href="{{ url_for('logout') }}" class="btn btn-secondary hvr-round-corners">Logout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
