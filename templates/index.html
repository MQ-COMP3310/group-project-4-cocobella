{% extends 'base.html' %} {% block content %}
<div class="container base-content main-page">
    <div class="row">
        <div class="col text-center">
            <br>

            {% if current_user.is_authenticated %}
                <h3>Welcome, {{ current_user.username }}</h3>
                <p>You are logged in, so your score will be saved to your account.</p>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="btn btn-dark hvr-round-corners">Play</button>
                </form>
            {% else %}
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <label for="username">To Continue, Please Enter Your Name</label>
                    <br>
                    <input type="text" id="username" name="username" autofocus/>
                    <br>
                    <br>
                    <button class="btn btn-dark hvr-round-corners">Submit</button>
                </form>
            {% endif %}

        </div>
    </div>
</div>
{% endblock %}
